<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#c62828">
  <title>ラジ英</title>
  
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%23c62828'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='190' fill='%23ffffff'%3Eラジ英%3C/text%3E%3C/svg%3E">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%23c62828'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='190' fill='%23ffffff'%3Eラジ英%3C/text%3E%3C/svg%3E">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Noto Sans JP", sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      max-width: 440px;
      width: 100%;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .header-tag {
      background-color: #c62828;
      color: #fff;
      font-weight: 700;
      text-align: center;
      padding: 6px;
      border-radius: 20px;
      letter-spacing: 1.5px;
      font-size: 13px;
    }
    .sub-title {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #444;
      margin: 8px 0 14px;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .custom-select {
      width: 100%;
      padding: 10px 8px;
      border-radius: 8px;
      border: 1px solid #cfd8dc;
      background-color: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      color: #263238;
      outline: none;
    }
    .prompt-box {
      background-color: #fdf2ea;
      border: 1px solid #f6d2c4;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      font-size: 15px;
      line-height: 1.6;
      color: #1a1a1a;
    }
    .situation {
      color: #8d4b38;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .btn-toggle-container {
      margin-bottom: 10px;
    }
    .nav-btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-toggle {
      background-color: #1976d2;
      color: white;
    }
    .btn-nav {
      background-color: #37474f;
      color: white;
    }
    .hidden {
      display: none;
    }
    .badge {
      display: inline-block;
      background: #212121;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .answer-text {
      font-size: 15px;
      font-weight: 700;
      color: #111;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .explanation-text {
      font-size: 13px;
      color: #333;
      line-height: 1.65;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid #c62828;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header-tag">PRACTICAL USAGE</div>
  <div class="sub-title">表現を実践で使ってみよう</div>

  <!-- 月選択 ＆ レッスン選択 -->
  <div class="controls-grid">
    <select id="month-selector" class="custom-select" onchange="onMonthChange(this.value)">
    </select>
    <select id="lesson-selector" class="custom-select" onchange="onLessonChange(this.value)">
    </select>
  </div>

  <div class="prompt-box">
    <div class="situation" id="situation"></div>
    <div id="japanese-text"></div>
  </div>

  <div class="btn-toggle-container">
    <button class="btn-toggle" onclick="toggleAnswer()" id="toggle-btn">解答・解説を見る</button>
  </div>

  <div class="nav-btn-group">
    <button class="btn-nav" onclick="prevQuestion()">前の問題</button>
    <button class="btn-nav" onclick="nextQuestion()">次の問題</button>
  </div>

  <div id="answer-area" class="hidden">
    <div><span class="badge">解答例</span></div>
    <div class="answer-text" id="english-text"></div>

    <div><span class="badge">解説</span></div>
    <div class="explanation-text" id="explanation-text"></div>
  </div>
</div>

    {

  let currentMonth = "";
  let filteredQuestions = [];
  let currentFilteredIndex = 0;

  // 月セレクターの初期化
  function initMonthSelector() {
    const monthSet = new Set(questions.map(q => q.month || "未分類"));
    const months = Array.from(monthSet);
    const mSelector = document.getElementById("month-selector");
    mSelector.innerHTML = "";
    months.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m;
      opt.textContent = m;
      mSelector.appendChild(opt);
    });
    currentMonth = months[0] || "";
    updateFilteredQuestions();
  }

  // 選択中の月に属する問題を抽出し、レッスンセレクターを更新
  function updateFilteredQuestions() {
    filteredQuestions = questions.filter(q => (q.month || "未分類") === currentMonth);
    const lSelector = document.getElementById("lesson-selector");
    lSelector.innerHTML = "";
    filteredQuestions.forEach((q, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = `${q.lesson} ${q.situation}`;
      lSelector.appendChild(opt);
    });
    currentFilteredIndex = 0;
    renderQuestion();
  }

  function renderQuestion() {
    if (filteredQuestions.length === 0) return;
    const q = filteredQuestions[currentFilteredIndex];
    document.getElementById("situation").textContent = `[ ${q.lesson} ${q.situation} ]`;
    document.getElementById("japanese-text").textContent = q.ja;
    document.getElementById("english-text").textContent = q.en;
    document.getElementById("explanation-text").textContent = q.exp;

    document.getElementById("lesson-selector").value = currentFilteredIndex;

    document.getElementById("answer-area").classList.add("hidden");
    document.getElementById("toggle-btn").textContent = "解答・解説を見る";
  }

  function toggleAnswer() {
    const area = document.getElementById("answer-area");
    const btn = document.getElementById("toggle-btn");
    if (area.classList.contains("hidden")) {
      area.classList.remove("hidden");
      btn.textContent = "解答・解説を隠す";
    } else {
      area.classList.add("hidden");
      btn.textContent = "解答・解説を見る";
    }
  }

  function nextQuestion() {
    if (filteredQuestions.length === 0) return;
    currentFilteredIndex = (currentFilteredIndex + 1) % filteredQuestions.length;
    renderQuestion();
  }

  function prevQuestion() {
    if (filteredQuestions.length === 0) return;
    currentFilteredIndex = (currentFilteredIndex - 1 + filteredQuestions.length) % filteredQuestions.length;
    renderQuestion();
  }

  function onMonthChange(month) {
    currentMonth = month;
    updateFilteredQuestions();
  }

  function onLessonChange(index) {
    currentFilteredIndex = parseInt(index, 10);
    renderQuestion();
  }

  // 初期起動
  initMonthSelector();
</script>
