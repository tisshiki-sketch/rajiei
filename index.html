<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#c62828">
  <title>ラジ英</title>  
  <!-- 赤地に白文字の「ラジ英」アプリアイコン（SVG形式） -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%23c62828'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='190' fill='%23ffffff'%3Eラジ英%3C/text%3E%3C/svg%3E">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%23c62828'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='190' fill='%23ffffff'%3Eラジ英%3C/text%3E%3C/svg%3E">
  <style> 
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Noto Sans JP", sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      max-width: 440px;
      width: 100%;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .header-tag {
      background-color: #c62828;
      color: #fff;
      font-weight: 700;
      text-align: center;
      padding: 6px;
      border-radius: 20px;
      letter-spacing: 1.5px;
      font-size: 13px;
    }
    .sub-title {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #444;
      margin: 8px 0 14px;
    }
    /* レッスン選択プルダウン */
    .select-container {
      margin-bottom: 14px;
    }
    .lesson-select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cfd8dc;
      background-color: #f8fafc;
      font-size: 14px;
      font-weight: 600;
      color: #263238;
      outline: none;
    }
    .prompt-box {
      background-color: #fdf2ea;
      border: 1px solid #f6d2c4;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      font-size: 15px;
      line-height: 1.6;
      color: #1a1a1a;
    }
    .situation {
      color: #8d4b38;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    /* ボタンエリア */
    .btn-toggle-container {
      margin-bottom: 10px;
    }
    .nav-btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-toggle {
      background-color: #1976d2;
      color: white;
    }
    .btn-nav {
      background-color: #37474f;
      color: white;
    }
    .hidden {
      display: none;
    }
    .badge {
      display: inline-block;
      background: #212121;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .answer-text {
      font-size: 15px;
      font-weight: 700;
      color: #111;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .explanation-text {
      font-size: 13px;
      color: #333;
      line-height: 1.65;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid #c62828;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header-tag">PRACTICAL USAGE</div>
  <div class="sub-title">表現を実践で使ってみよう</div>

  <!-- レッスン選択プルダウン -->
  <div class="select-container">
    <select id="lesson-selector" class="lesson-select" onchange="onSelectChange(this.value)">
      <!-- JavaScriptで自動生成されます -->
    </select>
  </div>

  <!-- 問題表示エリア -->
  <div class="prompt-box">
    <div class="situation" id="situation"></div>
    <div id="japanese-text"></div>
  </div>

  <!-- 解答・解説表示ボタン -->
  <div class="btn-toggle-container">
    <button class="btn-toggle" onclick="toggleAnswer()" id="toggle-btn">解答・解説を見る</button>
  </div>

  <!-- 前へ / 次へ ボタン -->
  <div class="nav-btn-group">
    <button class="btn-nav" onclick="prevQuestion()">前の問題</button>
    <button class="btn-nav" onclick="nextQuestion()">次の問題</button>
  </div>

  <!-- 解答・解説エリア -->
  <div id="answer-area" class="hidden">
    <div><span class="badge">解答例</span></div>
    <div class="answer-text" id="english-text"></div>

    <div><span class="badge">解説</span></div>
    <div class="explanation-text" id="explanation-text"></div>
  </div>
</div>

<script>
  // lesson プロパティを追加しています
  const questions = [
    {
      lesson: "L121",
      situation: "パートナーの外出に気がついて",
      ja: "出かけるの？ ゴミも出してくれる？ ネットの下にちゃんと置いてね、わかった？ ありがとう！",
      en: "Are you heading out? Take the garbage out, too, will you? Make sure to put it under the net, OK? Thank you!",
      exp: "head out は「出かける・出発する」。カジュアルなフレーズです。次の文で「, will you?」を使うことができれば OK。家族の間でも、素の命令文は強すぎることが多いのです。take ~ out は「〜を外に持っていく」。Make sure to ~ は「必ず〜して」という頻出フレーズです。"
    },
    {
      lesson: "L122",
      situation: "会社で新人に指導しています",
      ja: "仕事用の携帯電話は常に携帯しておくこと。顧客からの電話に出られない場合は、5分以内に折り返し連絡しなければなりません。例外はありません。",
      en: "You are to carry your work phone at all times. If you miss a call from a client, you must call them back within five minutes. No exceptions.",
      exp: "You are to ~ の感情を交えない無機質な指示ができたなら、まさしく英語上級者です。at all times は「いつも・常に」。client は「顧客」。call ~ back は「〜に折り返し電話をかける」。2文目の them は a client を受けています。a client は単数ですが性別が不明で、him or her と述べるのが煩雑なため them で受けるのです。No exceptions. は、非常に強い「例外はありません・認めません」という指示です。"
    },
    {
      lesson: "L123",
      situation: "連絡をせず待ち合わせに遅れた恋人に",
      ja: "遅れそうなら、私に電話してほしい。もう少し私の時間も尊重してほしいんだ。そうしてくれる？",
      en: "If you're going to be late, I expect you to call me. I need you to respect my time a little more. Can you do that?",
      exp: "be going to のイメージは「流れの中」。「遅刻しそう」という状況ですね。expect you to ~ は、「あなたが当然〜するものと期待する」ということ。当然のこととして相手に要求しています。need you to respect ~ では、respect（〜を尊重する）する必要があると、冷静に必要性を説いています。どちらも「〜してほしい」と訳が重なってしまいますが、繊細に使い分けられているのです。"
    },
    {
      lesson: "L124",
      situation: "同僚に「スピーチの準備はどんな感じ？ 聞かせてみて」と言われて",
      ja: "もちろん、いいよ。まだ作成途中のものだということは頭に入れておいてね、いい？ あなたなら何を変えるか教えてね。",
      en: "Sure, yeah. Keep in mind that it's a work in progress, OK? Let me know what you would change.",
      exp: "Sure, yeah. は「もちろん、いいよ」。短い返事を重ねている感じです。よく使います。次の文の Keep in mind ができれば OK。a work in progress は「進行中の仕事」。未完成であることを表す頻用句です。what you would change の would には、「あなたなら〜でしょう」という仮定条件が織り込まれています。これができたなら、これまでのレッスンでしつこく would を解説したかいがあったというもの (^-^)"
    },
    {
      lesson: "L126",
      situation: "会社を出る際、まだ仕事をしている同僚に声をかけましょう",
      ja: "じゃあ、私は今夜はもう帰るよ。帰る前にちゃんと戸締まりしてね、いい？ それから、電気も忘れずに全部消しておいて。",
      en: "All right, I’m going home for the night. Make sure to lock up before you leave, OK? And be sure to turn off all the lights.",
      exp: "for the night の for は、範囲（今夜としては）を表しています。つまり、「今夜はもう上がるよ」というお決まりのフレーズ。Make sure to が口から出れば OK ですよ。lock up の up は「完全性の up」。店・オフィス全体の戸締まりを意味しています。Be sure to ~ は忘れないようにという指示でしたね。"
    },
    {
      lesson: "L127",
      situation: "試合に負けて、「もしもっと頑張っていたなら」と悔やんでいるチームメートに",
      ja: "ねぇ、自分を責めるのはやめな。あなたのせいじゃなかった。あなたはベストを尽くした。そのことは絶対に忘れないで。",
      en: "Hey, stop blaming yourself. It wasn’t your fault. You tried your best. Never forget that.",
      exp: "stop + 動詞 -ing 形はできましたか？ 目的語には動詞 -ing 形を使ってくださいね。blame は「〜を非難する」。fault は「過ち・過失」。「〜のせい」ということです。Never ~ は強い禁止表現でしたね。"
    },
    {
      lesson: "L128",
      situation: "教授が学期の初めに授業のルールを説明しています",
      ja: "私のコースではデジタル機器は使いません。学生は電子機器の使用は禁止です。授業への持ち込みもできません、ノートをとるためであってもです。",
      en: "My courses are low-tech. Students may not use electronics. You cannot bring them to class—not even for note-taking.",
      exp: "may not の公的禁止、cannot の「〜できません」が使えれば OK。low-tech は「ハイテクではない」ということ。デジタル機器が使えないということです。electronics は「電子機器」。ちなみに cannot は通常分かち書きにしないことも覚えておきましょう。"
    },
    {
      lesson: "L129",
      situation: "友人に「そのゲーム面白そう！ やってもいい？」と言われて",
      ja: "やってもいいけど、私のキャラクターは使わないほうがいいぞ。それから、セーブデータを上書きしないように気をつけて！",
      en: "You can play, but you had better not use my character. And be careful not to overwrite my save file!",
      exp: "you had better not ~ は「〜しないほうがいい、そうすると困ったことになる」。不気味な強さが感じられますね。be careful not to ~ では、to 不定詞の前に not を置き「〜しないように（注意する）」としています。overwrite は「〜を上書きする」。元のデータが消えてしまいます。"
    },
    {
      lesson: "L131",
      situation: "パイを作りながらパートナーに",
      ja: "ちょうど今、パイをオーブンから出したところ。でも言っておくけど、触っちゃだめ。まだ焼き型がものすごく熱いから。",
      en: "I just took the pie out of the oven. I’m warning you though, don’t touch it. The pan is still extremely hot.",
      exp: "out of ~ は「〜から（外に）」。次の I’m warning you ができれば合格ですよ。though は「〜だが」。前の文脈を受けています。extremely は「極端に・とても」。"
    },
    {
      lesson: "L132",
      situation: "祖父母の家に行く子どもに",
      ja: "よし、息子よ。準備はばっちりだな。おばあちゃんとおじいちゃんの家で、楽しい週末を過ごしておいで。いい子にしているんだぞ、いい？ 向こうではちゃんと礼儀正しくするんだよ。",
      en: "OK, Son. You’re all set. Have a great weekend at Grandma and Grandpa’s house. Behave yourself, OK? Mind your manners while you’re there.",
      exp: "You’re all set. は覚えていましたか？（6月号 Lesson 59）「完全に整った状態」、つまりここでは準備が整った状態であることを示しています。Behave yourself. ができたなら OK。Mind your manners. は、「マナーに気をつけて」という一般的な注意でしたね。while は「〜の間」。"
    },
    {
      lesson: "L133",
      situation: "「どうでもいいよ。宿題なんて、やりたくなったらやるから」と言う子どもに、親が注意します",
      ja: "ちょっと待ちなさい。自分を何様だと思ってるの？ 私にその口の利き方はやめなさい。宿題。今すぐ。",
      en: "Excuse me? Who do you think you are? Watch your tone of voice with me. Homework. Now.",
      exp: "Excuse me は、「ちょっと待ちなさい・何を言っているの」など、相手の発言を聞きとがめる場合にも用います。Watch your tone of voice with me. では with me（私に対して）が加えられています。つけなくても意味は通じますが、こちらも覚えておいてくださいね。"
    },
    {
      lesson: "L134",
      situation: "スピーカーから大音量で音楽を聞いている友人に注意します",
      ja: "そんなに大きな音にしなきゃいけないの？ 少し音を下げられない？ それか、ヘッドホンをつけるかできない？",
      en: "Do you have to have the volume up so loud? Can’t you just turn it down a bit? Or wear headphones?",
      exp: "Do you have to ~ ? でうんざり感を出せたら合格。have the volume up so loud は、目的語説明型。「the volume = そんなに大きく上げるという状況を have する」ということ。turn ~ down は「〜を下げる」。wear は「〜を着ている・つけている」という状態を表します。"
    },
    {
      lesson: "L136",
      situation: "警察官が群衆をかき分け進んでいます",
      ja: "危ないぞ！ 通るぞ！ どいてくれ！ 動いて！ 動いて！ 動いて！",
      en: "Look out! Coming through! Get out of the way! Move! Move! Move!",
      exp: "反射的に使えて理解できることが要求される表現です。Look out! は「危ない！」でしたね。through は「〜を通って」。トンネル状のものを「通って」がイメージ。Get out of the way. も反射的に使えなくてはなりません。"
    },
    {
      lesson: "L137",
      situation: "友人と、海外旅行のために空港に向かう際に",
      ja: "念のため、空港には少なくとも3時間前には着くようにしようよ。そうして損はないでしょ？ 時間をゆったり使ってゆっくりできるし。",
      en: "Let’s try to get to the airport at least three hours early, just to be on the safe side. It can’t hurt, right? We can take our time and relax.",
      exp: "try + to 不定詞は「（これから）〜しようと試みる・頑張る」。just to be on the safe side などが使えたら OK。take one’s time は「時間を（手に取って）使う → 時間をかける・ゆっくりやる」ということ。不測の事態に備える各フレーズが自然に使われています。しっかりと音読・暗唱して、使い方を身につけてください。"
    },
    {
      lesson: "L138",
      situation: "レンタカー店のカウンターにやってきました。手続きを進めましょう",
      ja: "こんにちは、車を受け取りに来ました。エバンスの名前で予約しています。追加の保険があるなら、それに加入します。それと、チャイルドシートはレンタルできますか？",
      en: "Hi, I’m here to pick up my car. I have a reservation under Evans. I’ll take additional insurance, if you have it. Also, do you rent child seats?",
      exp: "pick ~ up は「〜をつまみ上げる・拾う → 〜を受け取る」。I have a reservation 以降が言えたら合格。additional は「追加の」。rent は「〜を貸す・借りる」。貸借両用の単語ですが、「有料」であることがポイントです。"
    },
    {
      lesson: "L139",
      situation: "スーパーのレジで Hi! Did you find everything OK today? と言われて",
      ja: "はい、ありがとうございました。掃除用品は分けて入れて、重い物は二重に袋に入れてもらえますか？ ありがとうございます。クレジットカードで支払います。",
      en: "I did, thanks. Can you bag the cleaning products separately, and double-bag the heavy stuff? Thank you so much. I’ll pay by credit card.",
      exp: "アメリカらしい受け答えです。2 文目の bag は「〜を袋詰めする」という動詞の使い方。stuff は things（もの）のカジュアルな言い方です。二重に袋に入れるお願いも遠慮なくしてみましょう。by credit card の by は「方法」を表しています。"
    }
  ];

  let currentIndex = 0;

  // プルダウンの選択肢を初期化
  function initSelector() {
    const selector = document.getElementById("lesson-selector");
    selector.innerHTML = "";
    questions.forEach((q, index) => {
      const option = document.createElement("option");
      option.value = index;
      option.textContent = `${q.lesson} - ${q.situation}`;
      selector.appendChild(option);
    });
  }

  function renderQuestion() {
    const q = questions[currentIndex];
    document.getElementById("situation").textContent = `[ ${q.lesson} ${q.situation} ]`;
    document.getElementById("japanese-text").textContent = q.ja;
    document.getElementById("english-text").textContent = q.en;
    document.getElementById("explanation-text").textContent = q.exp;

    // プルダウンの選択位置を同期
    document.getElementById("lesson-selector").value = currentIndex;

    // 解答を隠す
    document.getElementById("answer-area").classList.add("hidden");
    document.getElementById("toggle-btn").textContent = "解答・解説を見る";
  }

  function toggleAnswer() {
    const area = document.getElementById("answer-area");
    const btn = document.getElementById("toggle-btn");
    if (area.classList.contains("hidden")) {
      area.classList.remove("hidden");
      btn.textContent = "解答・解説を隠す";
    } else {
      area.classList.add("hidden");
      btn.textContent = "解答・解説を見る";
    }
  }

  function nextQuestion() {
    currentIndex = (currentIndex + 1) % questions.length;
    renderQuestion();
  }

  function prevQuestion() {
    currentIndex = (currentIndex - 1 + questions.length) % questions.length;
    renderQuestion();
  }

  function onSelectChange(value) {
    currentIndex = parseInt(value, 10);
    renderQuestion();
  }

  // 初期化実行
  initSelector();
  renderQuestion();
</script>
</body>
</html>
